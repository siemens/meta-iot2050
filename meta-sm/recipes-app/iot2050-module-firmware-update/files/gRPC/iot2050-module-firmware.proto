syntax = "proto3";

package iot2050.modulefirmware;

service ModuleFirmware {
  rpc GetCapabilities (Empty) returns (CapabilitiesReply) {}
  rpc Inspect (InspectRequest) returns (InspectionReply) {}
  rpc Update (UpdateRequest) returns (OperationReply) {}
  rpc GetOperation (OperationRequest) returns (OperationReply) {}
  rpc StreamOperationLogs (StreamOperationLogsRequest)
      returns (stream OperationLog) {}
}

message Empty {}

message CapabilitiesReply {
  bool supported = 1;
  int32 max_slots = 2;
  bool chip_a_supported = 3;
  bool chip_b_supported = 4;
}

message InspectRequest {
  int32 slot = 1;
  bool scan = 2;
}

message SlotInspection {
  int32 slot = 1;
  bool available = 2;
  bool chip_a_node = 3;
  bool chip_b_node = 4;
}

message InspectionReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  repeated SlotInspection slots = 4;
}

message UpdateRequest {
  int32 slot = 1;
  bytes firmware_a = 2;
  bytes firmware_b = 3;
}

message ChipResult {
  bool attempted = 1;
  bool success = 2;
  string error = 3;
}

message UpdateReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  int32 slot = 4;
  ChipResult chip_a = 5;
  ChipResult chip_b = 6;
  bool partial_failure = 7;
  bool reboot_required = 8;
}

enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_RUNNING = 1;
  OPERATION_SUCCEEDED = 2;
  OPERATION_FAILED = 3;
  OPERATION_INTERRUPTED = 4;
}

message OperationError {
  string code = 1;
  string message = 2;
}

message ModuleUpdateResult {
  int32 slot = 1;
  ChipResult chip_a = 2;
  ChipResult chip_b = 3;
  bool partial_failure = 4;
  bool reboot_required = 5;
}

message OperationRequest {
  string operation_id = 1;
}

message OperationReply {
  string operation_id = 1;
  OperationStatus status = 2;
  string code = 3;
  string message = 4;
  string created_at = 5;
  string updated_at = 6;
  string finished_at = 7;
  string last_message = 8;
  oneof outcome {
    ModuleUpdateResult update_result = 9;
    OperationError operation_error = 10;
  }
}

message StreamOperationLogsRequest {
  string operation_id = 1;
  uint64 after_sequence = 2;
}

message OperationLog {
  uint64 sequence = 1;
  string timestamp = 2;
  string message = 3;
}