header:
  version: 14
  includes:
   - kas/iot2050.yml
   - kas/opt/example.yml
   - kas/opt/node-red.yml
   - kas/opt/sm.yml

build_system: isar

target: iot2050-image-example

local_conf_header:
  efibootguard: |
    # Keep example aligned with its single BOOT partition layout.
    EFIBOOTGUARD_NUM_CONFIG_PARTS = "1"
