# Managed by iot2050-node-red-control
map $http_upgrade $iot2050_nodered_upgrade {
    default upgrade;
    '' close;
}
map $http_origin $iot2050_nodered_bad_origin {
    default 1;
    '' 0;
}
limit_req_zone $binary_remote_addr zone=iot2050_nodered_login:1m rate=5r/m;

server {
    listen @GATEWAY_PORT@ ssl;
    listen [::]:@GATEWAY_PORT@ ssl;
    ssl_certificate /etc/iot2050/web-gateway/tls.crt;
    ssl_certificate_key /etc/iot2050/web-gateway/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    if ($http_origin = "https://$http_host") { set $iot2050_nodered_bad_origin 0; }
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-IOT2050-Node-RED-Gate active always;

    location = /_node_red_auth {
        internal;
        proxy_pass http://unix:/run/iot2050-node-red-auth/auth.sock:/http/authenticate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length '';
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie '';
    }
    location = /admin/auth/token {
        limit_req zone=iot2050_nodered_login burst=5 nodelay;
        limit_req_status 429;
        if ($iot2050_nodered_bad_origin) { return 403; }
        proxy_set_header Host $http_host;
        proxy_set_header Cookie '';
        proxy_hide_header Set-Cookie;
        proxy_pass http://127.0.0.1:1881;
    }
    # Express accepts case variants and trailing slashes. Only expose the
    # canonical login route, so equivalent paths cannot evade its rate limit.
    location ~* ^/admin/auth/token/?$ { return 404; }
    location /admin/ {
        if ($iot2050_nodered_bad_origin) { return 403; }
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $iot2050_nodered_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie '';
        proxy_set_header X-User '';
        proxy_set_header X-Remote-User '';
        proxy_hide_header Set-Cookie;
        proxy_pass http://127.0.0.1:1881;
    }
    location /http/ {
        if ($iot2050_nodered_bad_origin) { return 403; }
        auth_request /_node_red_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $iot2050_nodered_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie '';
        proxy_set_header Authorization '';
        proxy_set_header X-User '';
        proxy_set_header X-Remote-User '';
        proxy_hide_header Set-Cookie;
        proxy_pass http://127.0.0.1:1881;
    }
    location = / { return 302 /admin/; }
    location / { return 404; }
}
