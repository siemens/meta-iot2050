[Unit]
Requires=iot2050-node-red-auth.service
After=iot2050-node-red-auth.service nginx.service
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
Type=exec
TimeoutStartSec=180
TimeoutStopSec=30
User=nodered
Group=nodered
SupplementaryGroups=iot2050-node-red-auth dialout
WorkingDirectory=/var/lib/node-red
ExecStart=
ExecStart=/usr/bin/node-red --settings /etc/node-red/settings.js -u /var/lib/node-red
ExecStartPre=+/usr/lib/iot2050/node-red-control/gate check
ExecStartPost=+/usr/lib/iot2050/node-red-control/gate open
ExecStopPost=+/usr/lib/iot2050/node-red-control/gate close
UMask=0077
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/var/lib/node-red
MemoryMax=512M
TasksMax=128
Restart=on-failure
RestartSec=5
