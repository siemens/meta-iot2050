header:
  version: 14

local_conf_header:
  dev_compat_accounts: |
    GROUPS += "gpio pinctrl i2c spi pwm iio dialout sudo"

    USERS += "root iot2050"

    USER_root[password] ??= "root"
    USER_root[flags] ??= "clear-text-password force-passwd-change"

    USER_iot2050[password] ??= "iot2050"
    USER_iot2050[flags] ??= "clear-text-password force-passwd-change create-home"
    USER_iot2050[groups] ??= "sudo gpio pinctrl i2c spi pwm iio dialout"
    USER_iot2050[shell] ??= "/bin/bash"

  dev_compat_root_ssh: |
    IOT2050_DEV_COMPAT_ROOT_SSH = "1"
    IOT2050_LOCK_ROOT_PASSWORD = "0"
