### Secure boot config
CONFIG_NETDEVICES=y
CONFIG_ENV_VARS_UBOOT_CONFIG=y
CONFIG_SPL_FIT_SIGNATURE=y
CONFIG_SHA512=y
CONFIG_BOOTDELAY=-2
CONFIG_BOOTCOMMAND="run start_watchdog; bootflow scan -lb; echo 'EFI Boot failed!'; led status-led-green off; led status-led-red on; sleep 1000; reset"
# CONFIG_CMD_BOOTD is not set
# CONFIG_CMD_BOOTI is not set
# CONFIG_BOOTM_LINUX is not set
# CONFIG_BOOTM_NETBSD is not set
# CONFIG_BOOTM_PLAN9 is not set
# CONFIG_BOOTM_RTEMS is not set
# CONFIG_BOOTM_VXWORKS is not set
# CONFIG_CMD_ELF is not set
# CONFIG_CMD_GO is not set
CONFIG_CMD_PART=y
# CONFIG_CMD_NET is not set
# CONFIG_ISO_PARTITION is not set
CONFIG_DEVICE_TREE_INCLUDES="custMpk.dtsi"
CONFIG_ENV_WRITEABLE_LIST=y
CONFIG_USB_STORAGE=y
# CONFIG_EFI_VARIABLES_PRESEED is not set
CONFIG_EFI_SECURE_BOOT=y
CONFIG_TEE=y
CONFIG_OPTEE=y
CONFIG_SUPPORT_EMMC_RPMB=y
CONFIG_EFI_MM_COMM_TEE=y
# CONFIG_CMD_MMC_RPMB is not set
CONFIG_IOT2050_REQUIRE_DMA_ISOLATION=y
