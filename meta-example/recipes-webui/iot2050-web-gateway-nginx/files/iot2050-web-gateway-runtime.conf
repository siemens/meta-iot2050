# Runtime serves Cockpit on loopback port 9090.
set $iot2050_backend_port 9090;

# Keep Cockpit English-only without changing the onboarding service's
# Accept-Language behavior. The response cookie also repairs browser profiles
# that already selected another Cockpit language.
proxy_set_header Accept-Language en;
proxy_set_header Cookie $iot2050_cockpit_cookie;
add_header Set-Cookie "CockpitLang=en; Path=/; SameSite=Lax" always;
