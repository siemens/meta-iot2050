[Unit]
# The onboarding package owns this relationship.  When it is absent, nginx
# starts normally in runtime mode without probing onboarding package files.
Wants=iot2050-firstboot-onboarding.service
After=iot2050-firstboot-onboarding.service

[Service]
# This drop-in runs after the gateway preparation drop-in, which selects the
# safe runtime default.  The selector switches to runtime after onboarding is
# complete, otherwise it selects the onboarding backend.
ExecStartPre=/usr/lib/iot2050/web-gateway/iot2050-web-gateway-select-mode auto --no-reload