syntax = "proto3";

package iot2050.firmware;

service Firmware {
  rpc GetCapabilities (Empty) returns (CapabilitiesReply) {}
  rpc Inspect (InspectRequest) returns (InspectionReply) {}
  rpc Update (UpdateRequest) returns (OperationReply) {}
  rpc GetOperation (OperationRequest) returns (OperationReply) {}
  rpc StreamOperationLogs (StreamOperationLogsRequest)
      returns (stream OperationLog) {}
  rpc InspectRollback (RollbackRequest) returns (RollbackReply) {}
  rpc Rollback (RollbackRequest) returns (OperationReply) {}
}

message Empty {}

message CapabilitiesReply {
  bool supported = 1;
  string details_json = 2;
}

message InspectRequest {
  string firmware_path = 1;
  bool pg2_only = 2;
}

message InspectionReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string details_json = 4;
}

message UpdateRequest {
  string firmware_path = 1;
  string backup_dir = 2;
  repeated string preserve_list = 3;
  bool reset = 4;
  bool pg2_only = 5;
  bool no_backup = 6;
  bool force = 7;
  bool verify_signature = 8;
  bool legacy_cli = 9;
}

message RollbackRequest {
  string backup_dir = 1;
  bool legacy_cli = 2;
}

message RollbackReply {
  bool ok = 1;
  string code = 2;
  string message = 3;
  string details_json = 4;
}

enum OperationStatus {
  OPERATION_STATUS_UNSPECIFIED = 0;
  OPERATION_RUNNING = 1;
  OPERATION_SUCCEEDED = 2;
  OPERATION_FAILED = 3;
  OPERATION_INTERRUPTED = 4;
}

message OperationError {
  string code = 1;
  string message = 2;
}

message UpdateResult {
  string firmware_name = 1;
  string target_version = 2;
  string target_board = 3;
  string firmware_sha256 = 4;
  bool signature_verified = 5;
  string backup_path = 6;
  string mode = 7;
  bool reboot_required = 8;
}

message RollbackResult {
  bool available = 1;
  uint64 size = 2;
  string sha256 = 3;
  string created_at = 4;
  string updater_version = 5;
  string source = 6;
  string mode = 7;
  bool reboot_required = 8;
}

message OperationReply {
  string operation_id = 1;
  string operation = 2;
  OperationStatus status = 3;
  string code = 4;
  string message = 5;
  string created_at = 6;
  string updated_at = 7;
  string finished_at = 8;
  string last_message = 9;
  oneof outcome {
    UpdateResult update_result = 10;
    RollbackResult rollback_result = 11;
    OperationError operation_error = 12;
  }
}

message OperationRequest {
  string operation_id = 1;
}

message StreamOperationLogsRequest {
  string operation_id = 1;
  uint64 after_sequence = 2;
}

message OperationLog {
  uint64 sequence = 1;
  string timestamp = 2;
  string message = 3;
}
